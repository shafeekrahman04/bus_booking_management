<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Bus Booking Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&amp;display=swap"
    rel="stylesheet" />
  <style type="text/tailwindcss">
    :root {
      --primary-color: #38e07b;
      --secondary-color: #2a9e58;
      --background-color: #1a1a1a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --accent-color: #4ce68c;
    }

    body {
      font-family: 'Spline Sans', sans-serif;
      background-color: var(--background-color);
      color: var(--text-primary);
    }

    .form-input {
      background-color: #2c2c2c;
      border: 1px solid #444;
      color: var(--text-primary);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(56, 224, 123, 0.3);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: #1a1a1a;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      transition: background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--secondary-color);
    }
  </style>
</head>

<body class="bg-[var(--background-color)]">
  <div class="flex flex-col min-h-screen">
    <header class="w-full border-b border-gray-700 bg-gray-900/50 backdrop-blur-sm">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <div class="size-8 text-[var(--primary-color)]">
            <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path clip-rule="evenodd"
                d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z"
                fill="currentColor" fill-rule="evenodd"></path>
            </svg>
          </div>
          <h1 class="text-xl font-bold">TravelEase</h1>
        </div>
        <nav class="hidden items-center gap-8 md:flex">
          <a class="text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
            th:href="@{/v1/home}">Home</a>
          <a class="text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
            th:href="@{/v1/routes}">Routes</a>
          <a class="text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
            th:href="@{/v1/home#contact}">Contact</a>
          <a class="rounded-full bg-gray-800 px-5 py-2.5 text-sm font-semibold text-[var(--text-primary)] transition-colors hover:bg-gray-700"
            th:href="@{/v1/signup}">Sign Up</a>
        </nav>
        <button class="md:hidden">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </button>
      </div>
    </header>
    <main class="flex-grow flex items-center justify-center p-4">
      <div class="w-full max-w-md mx-auto">
        <div class="bg-gray-900/50 backdrop-blur-sm p-8 rounded-2xl border border-gray-800">
          <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-[var(--text-primary)]">Welcome Back</h2>
            <p class="text-[var(--text-secondary)] mt-2">Log in to continue your journey.</p>
          </div>
          <form th:action="@{/login}" method="post" class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="email">Username</label>
              <input class="form-input w-full" id="username" name="username" placeholder="abc...," type="text" />
            </div>
            <div>
              <div class="flex items-center justify-between mb-2">
                <label class="block text-sm font-medium text-[var(--text-secondary)]" for="password">Password</label>
                <a class="text-sm text-[var(--primary-color)] hover:underline" href="#">Forgot password?</a>
              </div>
              <input class="form-input w-full" id="password" name="password" placeholder="••••••••" type="password" />
            </div>
            <button class="btn-primary w-full" type="submit">Log In</button>.
            <div th:if="${param.error}" class="alert-danger text-center mt-1" role="alert">
              <h5 style="font-family: Arial, sans-serif; color: #ec1616; background-color: #ffffff;">
                <i class=" la la-exclamation-triangle" style="margin-right: 8px;">Invalid Username or password.</i>
              </h5>
            </div>
          </form>

          <!-- Signup link instead of social login -->
          <div class="mt-6 text-center">
            <p class="text-sm text-[var(--text-secondary)]">
              Don’t have an account?
              <a th:href="@{/v1/signup}" class="text-[var(--primary-color)] font-medium hover:underline">Sign up</a>
            </p>
          </div>

        </div>
      </div>
    </main>
    <footer class="bg-gray-900 text-[var(--text-secondary)] mt-auto">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-sm">
        <p>© 2025 TravelEase. All rights reserved.</p>
      </div>
    </footer>
  </div>

</body>

</html>
