<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{public/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='routes'">
<head>
    <title>TravelEase - Bus Booking</title>
</head>

<th:block layout:fragment="content">
    <main class="flex-1 flex items-center justify-center py-16 px-4">
        <div class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Booking Form -->
            <div
                    class="lg:col-span-2 bg-[var(--surface-color)] p-8 rounded-xl shadow-lg border border-[var(--border-color)]">
                <h2 class="text-3xl font-bold text-center text-[var(--text-primary)] mb-8">Book Your Trip</h2>
                <!-- Keep form same as before but uses var(--colors) -->
                <form th:action="@{/v1/save-booking}" method="post" class="space-y-8">
                    <input type="hidden" name="routeId" th:value="${route.id}"/>

                    <!-- Route dropdown is not needed, show details instead -->
                    <div class="p-4 bg-gray-700 rounded-lg mb-6">
                        <p class="text-lg font-semibold"
                           th:text="${route.origin} + ' → ' + ${route.destination}"></p>
                        <p class="text-sm text-gray-400"
                           th:text="${route.pickupTime} + ' — ' + ${route.dropTime}"></p>
                        <p class="text-sm text-gray-400"
                           th:text="'₹' + ${route.pricePerSeat} + ' per seat'"></p>
                        <p class="text-sm text-gray-400"
                           th:text="'Total seats: ' + ${route.bus.capacity}"></p>
                    </div>

                    <!-- Seat selection -->
                    <h3 class="text-xl font-bold mb-4">Select Your Seat</h3>
                    <div class="bg-[var(--surface-color)] p-6 rounded-lg border border-[var(--border-color)]">
                        <div class="grid grid-cols-5 gap-3 max-w-sm mx-auto">
                            <div th:each="seat : ${#numbers.sequence(1, route.bus.capacity)}"
                                 th:classappend="${bookedSeats.contains(seat)} ? ' seat-unavailable' : ' seat-available'"
                                 class="seat text-center p-2 cursor-pointer">
                                <input type="checkbox" th:value="${seat}" name="seats"
                                       class="seat-checkbox"
                                       th:disabled="${bookedSeats.contains(seat)}"/>
                                <span class="seat text-center p-2" th:text="${seat}"></span>
                            </div>
                        </div>
                    </div>


                    <div class="flex items-center justify-center gap-6 mt-4 text-sm">
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded-sm bg-[var(--surface-color)] border border-[var(--border-color)]"></div>
                            <span class="text-[var(--text-secondary)]">Available</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded-sm bg-[var(--primary-color)]"></div>
                            <span class="text-[var(--text-secondary)]">Selected</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-4 h-4 rounded-sm bg-[#333] border border-[#333]"></div>
                            <span class="text-[var(--text-secondary)]">Unavailable</span>
                        </div>
                    </div>
                    <!-- Passenger Info -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                        <div>
                            <label for="name" class="block mb-2">Full Name</label>
                            <input type="text" id="name" name="name" required
                                   class="form-input w-full"/>
                        </div>
                        <div>
                            <label for="email" class="block mb-2">Email Address</label>
                            <input type="email" id="email" name="email" required
                                   class="form-input w-full"/>
                        </div>
                    </div>

                    <div class="text-center mt-6">
                        <button type="submit"
                                class="bg-[var(--primary-color)] text-black px-8 py-3 rounded-lg font-bold">
                            Confirm &amp; Book
                        </button>
                    </div>
                </form>

            </div>

            <!-- Booking Summary -->
            <div
                    class="bg-[var(--surface-color)] p-8 rounded-xl shadow-lg border border-[var(--border-color)] h-fit sticky top-28">
                <h3
                        class="text-2xl font-bold text-[var(--text-primary)] mb-6 border-b border-[var(--border-color)] pb-4">
                    Booking Summary</h3>
                <div class="space-y-4 text-base">
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Route:</span>
                        <span class="font-medium text-[var(--text-primary)]"
                              th:text="${route.origin} + ' → ' + ${route.destination}">New York to Boston</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Date:</span>
                        <span class="font-medium text-[var(--text-primary)]"
                              th:text="${route.date}">August 15, 2024</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Time:</span>
                        <span class="font-medium text-[var(--text-primary)]"
                              th:text="${route.pickupTime} + ' → ' + ${route.dropTime}">08:30 AM</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Seats:</span>
                        <span id="selectedSeats"
                              class="font-medium text-[var(--text-primary)]">None</span>
                    </div>

                    <div class="border-t border-[var(--border-color)] my-6"></div>
                    <div class="flex justify-between items-center text-lg">
                        <span class="font-bold text-[var(--text-primary)]">Total Cost:</span>
                        <span class="font-bold text-[var(--primary-color)] text-2xl"
                              th:text="'₹' + ${route.pricePerSeat}">$45.00</span>
                    </div>
                </div>
                <button
                        class="w-full mt-8 bg-[var(--primary-color)] text-black py-3 px-4 rounded-lg hover:bg-[var(--secondary-color)] focus:outline-none focus:ring-4 focus:ring-[var(--accent-color)] transition-all duration-300 font-bold text-lg transform hover:scale-105">
                    Confirm &amp; Book
                </button>
            </div>
        </div>
    </main>
</th:block>
<th:block layout:fragment="page-script">
    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const checkboxes = document.querySelectorAll(".seat-checkbox");
        const seatLabel = document.getElementById("selectedSeats");

        checkboxes.forEach(cb => {
            cb.addEventListener("change", () => {
                const selected = Array.from(checkboxes)
                    .filter(ch => ch.checked)
                    .map(ch => ch.value);

                seatLabel.textContent = selected.length > 0 ? selected.join(", ") : "None";
            });
        });
    });



    </script>
</th:block>
</html>
