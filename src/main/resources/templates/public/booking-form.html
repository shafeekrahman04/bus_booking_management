<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{public/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='routes'">
<head>
    <title>TravelEase - Bus Booking</title>
</head>

<th:block layout:fragment="content">
    <main class="flex-1 flex items-center justify-center py-16 px-4">
        <div class="w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-12">
            <!-- Booking Form -->
            <div
                    class="lg:col-span-2 bg-[var(--surface-color)] p-8 rounded-xl shadow-lg border border-[var(--border-color)]">
                <h2 class="text-3xl font-bold text-center text-[var(--text-primary)] mb-8">Book Your Trip</h2>
                <!-- Keep form same as before but uses var(--colors) -->
                <form class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-end">
                        <div>
                            <label class="form_label block text-sm font-medium text-[var(--text-secondary)] mb-2"
                                   for="route">Route</label>
                            <select
                                    class="form-select form-input w-full text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none"
                                    id="route" name="route">
                                <option>Select Route</option>
                                <option selected="" value="route1">New York to Boston</option>
                                <option value="route2">Los Angeles to San Francisco</option>
                                <option value="route3">Chicago to Detroit</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label
                                        class="form_label block text-sm font-medium text-[var(--text-secondary)] mb-2"
                                        for="date">Date</label>
                                <input
                                        class="form-input w-full text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none"
                                        id="date" name="date" type="date" value="2024-08-15"/>
                            </div>
                            <div>
                                <label
                                        class="form_label block text-sm font-medium text-[var(--text-secondary)] mb-2"
                                        for="passengers">Passengers</label>
                                <input
                                        class="form-input w-full text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none"
                                        id="passengers" min="1" name="passengers" placeholder="1" type="number"
                                        value="1"/>
                            </div>
                        </div>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-[var(--text-primary)] mb-4">Select Your Seat</h3>
                        <div class="bg-[var(--surface-color)] p-6 rounded-lg border border-[var(--border-color)]">
                            <div class="grid grid-cols-5 gap-3 max-w-sm mx-auto">
                                <div class="seat seat-available text-center p-2">1A</div>
                                <div class="seat seat-available text-center p-2">1B</div>
                                <div class="col-start-4 seat seat-selected text-center p-2">1C</div>
                                <div class="seat seat-unavailable text-center p-2">1D</div>
                                <div class="seat seat-available text-center p-2">2A</div>
                                <div class="seat seat-unavailable text-center p-2">2B</div>
                                <div class="col-start-4 seat seat-available text-center p-2">2C</div>
                                <div class="seat seat-available text-center p-2">2D</div>
                                <div class="seat seat-available text-center p-2">3A</div>
                                <div class="seat seat-available text-center p-2">3B</div>
                                <div class="col-start-4 seat seat-available text-center p-2">3C</div>
                                <div class="seat seat-available text-center p-2">3D</div>
                                <div class="seat seat-unavailable text-center p-2">4A</div>
                                <div class="seat seat-available text-center p-2">4B</div>
                                <div class="col-start-4 seat seat-available text-center p-2">4C</div>
                                <div class="seat seat-available text-center p-2">4D</div>
                            </div>
                        </div>
                        <div class="flex items-center justify-center gap-6 mt-4 text-sm">
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 rounded-sm bg-[var(--surface-color)] border border-[var(--border-color)]"></div>
                                <span class="text-[var(--text-secondary)]">Available</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 rounded-sm bg-[var(--primary-color)]"></div>
                                <span class="text-[var(--text-secondary)]">Selected</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="w-4 h-4 rounded-sm bg-[#333] border border-[#333]"></div>
                                <span class="text-[var(--text-secondary)]">Unavailable</span>
                            </div>
                        </div>

                    </div>
                    <div>
                        <h3 class="text-xl font-bold text-[var(--text-primary)] mb-4">Passenger Information</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label
                                        class="form_label block text-sm font-medium text-[var(--text-secondary)] mb-2"
                                        for="name">Full Name</label>
                                <input
                                        class="form-input w-full text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none"
                                        id="name" name="name" placeholder="John Doe" type="text"/>
                            </div>
                            <div>
                                <label
                                        class="form_label block text-sm font-medium text-[var(--text-secondary)] mb-2"
                                        for="email">Email Address</label>
                                <input
                                        class="form-input w-full text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none"
                                        id="email" name="email" placeholder="john.doe@example.com" type="email"/>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Booking Summary -->
            <div
                    class="bg-[var(--surface-color)] p-8 rounded-xl shadow-lg border border-[var(--border-color)] h-fit sticky top-28">
                <h3
                        class="text-2xl font-bold text-[var(--text-primary)] mb-6 border-b border-[var(--border-color)] pb-4">
                    Booking Summary</h3>
                <div class="space-y-4 text-base">
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Route:</span>
                        <span class="font-medium text-[var(--text-primary)]">New York to Boston</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Date:</span>
                        <span class="font-medium text-[var(--text-primary)]">August 15, 2024</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Time:</span>
                        <span class="font-medium text-[var(--text-primary)]">08:30 AM</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Passengers:</span>
                        <span class="font-medium text-[var(--text-primary)]">1</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--text-secondary)]">Seats:</span>
                        <span class="font-medium text-[var(--text-primary)]">1C</span>
                    </div>
                    <div class="border-t border-[var(--border-color)] my-6"></div>
                    <div class="flex justify-between items-center text-lg">
                        <span class="font-bold text-[var(--text-primary)]">Total Cost:</span>
                        <span class="font-bold text-[var(--primary-color)] text-2xl">$45.00</span>
                    </div>
                </div>
                <button
                        class="w-full mt-8 bg-[var(--primary-color)] text-black py-3 px-4 rounded-lg hover:bg-[var(--secondary-color)] focus:outline-none focus:ring-4 focus:ring-[var(--accent-color)] transition-all duration-300 font-bold text-lg transform hover:scale-105">
                    Confirm &amp; Book
                </button>
            </div>
        </div>
    </main>
</th:block>

</html>
