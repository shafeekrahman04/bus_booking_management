<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{public/layout}"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='my-booking'">

<head>
    <title>TravelEase - Ticket</title>
</head>

<th:block layout:fragment="content">
    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10 flex justify-center items-center flex-grow">
        <div id="ticket-container"
            class="w-full max-w-2xl bg-gray-900 rounded-2xl shadow-xl overflow-hidden border border-gray-700">
            <!-- Header -->
            <div
                class="bg-[var(--primary-color)] text-[var(--background-color)] px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold">TravelEase Ticket</h2>
                <span class="text-sm" th:text="'Booking ID: ' + ${booking.id}"></span>
            </div>

            <!-- Ticket Body -->
            <div class="p-6 space-y-6">
                <!-- Route Info -->
                <div class="flex justify-between items-center border-b border-gray-700 pb-4">
                    <div>
                        <h3 class="text-lg font-semibold text-[var(--text-primary)]" th:text="${booking.route.origin}">
                        </h3>
                        <p class="text-sm text-[var(--text-secondary)]">Origin</p>
                        <p class="mt-1 text-sm font-medium" th:text="${booking.route.date}"></p>
                        <p class="text-sm" th:text="${booking.route.pickupTime}"></p>
                    </div>
                    <div class="flex-1 text-center">
                        <div class="text-[var(--primary-color)] text-3xl font-bold">→</div>
                    </div>
                    <div class="text-right">
                        <h3 class="text-lg font-semibold text-[var(--text-primary)]"
                            th:text="${booking.route.destination}"></h3>
                        <p class="text-sm text-[var(--text-secondary)]">Destination</p>
                    </div>
                </div>

                <!-- Bus Info -->
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <p class="text-[var(--text-secondary)]">Bus Name:
                        <span class="font-medium text-[var(--text-primary)]"
                            th:text="${booking.route.bus.busName}"></span>
                    </p>
                    <p class="text-[var(--text-secondary)]">Bus Number:
                        <span class="font-medium text-[var(--text-primary)]"
                            th:text="${booking.route.bus.busNumber}"></span>
                    </p>
                    <p class="text-[var(--text-secondary)]">Bus Type:
                        <span class="font-medium" th:text="${booking.route.bus.busType}"></span>
                    </p>
                    <p class="text-[var(--text-secondary)]">Status:
                        <span th:classappend="${booking.status == 'CONFIRMED'} ? 'text-green-400' :
                                              (${booking.status == 'CANCELLED'} ? 'text-red-400' : 'text-yellow-400')"
                            th:text="${booking.status}"></span>
                    </p>
                </div>

                <!-- Seat Numbers -->
                <div>
                    <h4 class="text-sm font-medium text-[var(--text-secondary)]">Seats</h4>
                    <div class="flex flex-wrap gap-2 mt-2">
                        <span th:each="seat : ${booking.seatNumbers}"
                            class="px-3 py-1 text-sm font-semibold rounded-full bg-[var(--primary-color)] text-[var(--background-color)] shadow">
                            <span th:text="${seat}"></span>
                        </span>
                    </div>
                </div>

                <!-- Passenger Info -->
                <div class="border-t border-gray-700 pt-4">
                    <h4 class="text-sm font-medium text-[var(--text-secondary)] mb-2">Passenger</h4>
                    <p class="text-[var(--text-secondary)]">Name:
                        <span class="font-medium text-[var(--text-primary)]" th:text="${booking.customerName}"></span>
                    </p>
                    <p class="text-[var(--text-secondary)]">Mobile No:
                        <span class="font-medium text-[var(--text-primary)]" th:text="${booking.customerMobile}"></span>
                    </p>
                </div>

                <!-- QR Code -->
                <div class="flex justify-center border-t border-gray-700 pt-6">
                    <img th:src="@{/v1/ticket/qrcode/{id}(id=${booking.id})}" alt="QR Code"
                        class="w-32 h-32 border border-gray-600 rounded-md" />
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-gray-800 px-6 py-3 flex justify-between items-center">
                <p class="text-xs text-gray-400">Generated on
                    <span th:text="${#dates.format(#dates.createNow(), 'dd MMM yyyy HH:mm')}"></span>
                </p>
                <button onclick="printTicket() "
                    class="px-4 py-1 text-sm bg-[var(--primary-color)] text-[var(--background-color)] rounded-md hover:bg-[var(--accent-color)]">
                    Print Ticket
                </button>
            </div>
        </div>
    </main>
</th:block>
<th:block layout:fragment="page-script">
    <script>
        function printTicket() {
            const ticketContent = document.getElementById("ticket-container").outerHTML;
            const printWindow = window.open("", "_blank", "width=800,height=600");

            printWindow.document.write(`
        <html>
          <head>
            <title>Print Ticket</title>
            <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
            <style>
                 :root {
              --primary-color: #38e07b;
              --secondary-color: #2a9e58;
              --background-color: #1a1a1a;
              --text-primary: #e0e0e0;
              --text-secondary: #a0a0a0;
              --accent-color: #4ce68c;
    }
    body {
        font-family: 'Spline Sans', sans-serif;
        background-color: var(--background-color);
        color: var(--text-primary);
    }
            </style>
          </head>
          <body class="bg-gray-900">
            ${ticketContent}
            <script>
              window.onload = function() {
                window.print();
                window.close();
              }
            <\/script>
          </body>
        </html>
    `);

            printWindow.document.close();
        }

    </script>
</th:block>

</html>
