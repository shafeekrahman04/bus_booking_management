<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{public/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='routes'">
<head>
    <title>TravelEase - Bus Booking</title>
</head>

<th:block layout:fragment="content">
    <main class="flex-grow">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="bg-gray-800 rounded-xl shadow-lg p-6 md:p-8 border border-gray-700">
                <h2 class="text-3xl font-bold text-center mb-6">Find Your Bus Route</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="relative">
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1"
                               for="origin">Origin</label>
                        <select
                                class="w-full bg-gray-700 border border-gray-600 text-[var(--text-primary)] px-4 py-3 rounded-lg focus:outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]"
                                id="origin" name="origin">
                            <option>New York, NY</option>
                            <option>Boston, MA</option>
                            <option>Philadelphia, PA</option>
                        </select>
                    </div>
                    <div class="relative">
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1"
                               for="destination">Destination</label>
                        <select
                                class="w-full bg-gray-700 border border-gray-600 text-[var(--text-primary)] px-4 py-3 rounded-lg focus:outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]"
                                id="destination" name="destination">
                            <option>Boston, MA</option>
                            <option>New York, NY</option>
                            <option>Washington, D.C.</option>
                        </select>
                    </div>
                    <div class="relative">
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1"
                               for="date">Date</label>
                        <input
                                class="w-full bg-gray-700 border border-gray-600 text-[var(--text-primary)] px-4 py-3 rounded-lg focus:outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]"
                                id="date" name="date" type="date" value="2024-05-20"/>
                    </div>
                    <div class="relative">
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-1"
                               for="time">Time</label>
                        <select
                                class="w-full bg-gray-700 border border-gray-600 text-[var(--text-primary)] px-4 py-3 rounded-lg focus:outline-none focus:border-[var(--primary-color)] focus:ring-1 focus:ring-[var(--primary-color)]"
                                id="time" name="time">
                            <option>Any Time</option>
                            <option>Morning (6am - 12pm)</option>
                            <option>Afternoon (12pm - 6pm)</option>
                            <option>Evening (6pm - 12am)</option>
                        </select>
                    </div>
                </div>
                <div class="text-center">
                    <button
                            class="bg-[var(--primary-color)] text-gray-900 px-8 py-3 rounded-lg font-bold hover:bg-[var(--secondary-color)] transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-opacity-50">
                        Search
                    </button>
                </div>
            </div>
            <div class="mt-8">
                <h3 class="text-2xl font-semibold mb-4">Available Routes</h3>
                <div class="space-y-4">
                    <a href="booking-form.html" class="block bg-gray-800 rounded-lg shadow p-4 md:p-6 border border-gray-700
                        flex items-center justify-between hover:border-[var(--accent-color)] 
                        transition-colors duration-200">
                        <div class="flex items-center">
                            <div class="hidden sm:block mr-4">
                                <div class="bg-gray-700 p-3 rounded-lg">
                                    <svg class="w-6 h-6 text-[var(--accent-color)]" fill="none"
                                         stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                                         xmlns="http://www.w3.org/2000/svg">
                                        <path
                                                d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.125-.504 1.125-1.125V14.25m-17.25 4.5v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 1.5 12V5.625c0-.621.504-1.125 1.125-1.125h1.5A3.375 3.375 0 0 0 7.5 7.875v1.875m11.25 0V7.875a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 0 12 5.625v6.75m1.5-3.375h.008v.008H13.5v-.008Zm-3 0h.008v.008H10.5v-.008Zm-3 0h.008v.008H7.5v-.008Z"
                                                stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </div>
                            </div>
                            <div>
                                <p class="text-lg font-semibold">Route A: New York to Boston</p>
                                <p class="text-sm text-[var(--text-secondary)]">10:00 AM — 02:00 PM (4h 0m)</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-bold text-[var(--primary-color)]">$25</p>
                            <p class="text-sm text-[var(--text-secondary)]">15 seats left</p>
                        </div>
                    </a>
                    <a href="booking-form.html" class="block bg-gray-800 rounded-lg shadow p-4 md:p-6 border border-gray-700
                        flex items-center justify-between hover:border-[var(--accent-color)] 
                        transition-colors duration-200">
                        <div class="flex items-center">
                            <div class="hidden sm:block mr-4">
                                <div class="bg-gray-700 p-3 rounded-lg">
                                    <svg class="w-6 h-6 text-[var(--accent-color)]" fill="none"
                                         stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                                         xmlns="http://www.w3.org/2000/svg">
                                        <path
                                                d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.125-.504 1.125-1.125V14.25m-17.25 4.5v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 1.5 12V5.625c0-.621.504-1.125 1.125-1.125h1.5A3.375 3.375 0 0 0 7.5 7.875v1.875m11.25 0V7.875a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 0 12 5.625v6.75m1.5-3.375h.008v.008H13.5v-.008Zm-3 0h.008v.008H10.5v-.008Zm-3 0h.008v.008H7.5v-.008Z"
                                                stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </div>
                            </div>
                            <div>
                                <p class="text-lg font-semibold">Route B: New York to Boston</p>
                                <p class="text-sm text-[var(--text-secondary)]">01:00 PM — 05:00 PM (4h 0m)</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-bold text-[var(--primary-color)]">$30</p>
                            <p class="text-sm text-[var(--text-secondary)]">5 seats left</p>
                        </div>
                    </a>
                    <a href="booking-form.html" class="block bg-gray-800 rounded-lg shadow p-4 md:p-6 border border-gray-700
                        flex items-center justify-between hover:border-[var(--accent-color)] 
                        transition-colors duration-200">
                        <div class="flex items-center">
                            <div class="hidden sm:block mr-4">
                                <div class="bg-gray-700 p-3 rounded-lg">
                                    <svg class="w-6 h-6 text-[var(--accent-color)]" fill="none"
                                         stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"
                                         xmlns="http://www.w3.org/2000/svg">
                                        <path
                                                d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125..."
                                                stroke-linecap="round" stroke-linejoin="round"></path>
                                    </svg>
                                </div>
                            </div>
                            <div>
                                <p class="text-lg font-semibold">Route A: New York to Boston</p>
                                <p class="text-sm text-[var(--text-secondary)]">10:00 AM — 02:00 PM (4h 0m)</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-xl font-bold text-[var(--primary-color)]">$25</p>
                            <p class="text-sm text-[var(--text-secondary)]">15 seats left</p>
                        </div>
                    </a>

                </div>
            </div>
        </div>
    </main>
</th:block>

</html>
