<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{public/layout}" th:with="activePage='routes'">

<head>
  <title>TravelEase - Bus Booking</title>
</head>

<th:block layout:fragment="content">
  <main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Search Form -->
      <div class="bg-gray-800 rounded-xl shadow-lg p-6 md:p-8 border border-gray-700">
        <h2 class="text-3xl font-bold text-center mb-6">Find Your Bus Route</h2>

        <form id="routeSearchForm" th:action="@{/v1/routes}" method="get" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Origin Input -->
            <div class="relative">
              <label for="origin" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">
                Origin
              </label>
              <input type="text" id="origin" name="origin" th:value="${origin ?: ''}" placeholder="Enter origin city"
                class="w-full bg-gray-700 border border-gray-600 text-[var(--text-primary)] px-4 py-3
                                          rounded-lg focus:outline-none focus:border-[var(--primary-color)]
                                          focus:ring-1 focus:ring-[var(--primary-color)]" />
            </div>

            <!-- Destination Input -->
            <div class="relative">
              <label for="destination" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">
                Destination
              </label>
              <input type="text" id="destination" name="destination" th:value="${destination ?: ''}"
                placeholder="Enter destination city" class="w-full bg-gray-700 border border-gray-600 text-[var(--text-primary)] px-4 py-3
                                          rounded-lg focus:outline-none focus:border-[var(--primary-color)]
                                          focus:ring-1 focus:ring-[var(--primary-color)]" />
            </div>

            <!-- Date Input -->
            <div class="relative">
              <label for="date" class="block text-sm font-medium text-[var(--text-secondary)] mb-2">
                Date
              </label>
              <input type="date" id="date" name="date" th:value="${date ?: ''}"
                th:attr="min=${#dates.format(#dates.createNow(),'yyyy-MM-dd')}" class="w-full bg-gray-700 border border-gray-600 text-[var(--text-primary)] px-4 py-3
              rounded-lg focus:outline-none focus:border-[var(--primary-color)]
              focus:ring-1 focus:ring-[var(--primary-color)]" />

            </div>
          </div>

          <div class="text-center">
            <button type="submit"
              class="bg-[var(--primary-color)] text-gray-900 px-10 py-3 rounded-lg font-bold
                                       hover:bg-[var(--secondary-color)] transition-colors duration-200 ease-in-out
                                       focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-opacity-50">
              Search
            </button>
          </div>
        </form>
      </div>

      <!-- Results -->
      <div class="mt-10">
        <h3 class="text-2xl font-semibold mb-4">Available Routes</h3>
        <div class="space-y-4">
          <!-- No results -->
          <div th:if="${#lists.isEmpty(routesList)}">
            <p class="text-gray-400">No routes found for your search.</p>
          </div>

          <!-- Results Loop -->
          <a th:each="route : ${routesList}" th:href="@{/v1/add-booking(routeId=${route.id})}" class="route-item block bg-gray-800 rounded-lg shadow p-6 border border-gray-700
                              flex items-center justify-between hover:border-[var(--accent-color)]
                              transition-colors duration-200">

            <div class="flex items-center">
              <div class="hidden sm:block mr-4">
                <div class="bg-gray-700 p-3 rounded-lg">
                  <svg class="w-6 h-6 text-[var(--accent-color)]" fill="none" stroke="currentColor" stroke-width="1.5"
                    viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375
                                                 a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0
                                                 a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.125-.504 1.125-1.125V14.25
                                                 m-17.25 4.5v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125
                                                 0 0 1 1.5 12V5.625c0-.621.504-1.125 1.125-1.125h1.5A3.375 3.375
                                                 0 0 0 7.5 7.875v1.875m11.25 0V7.875a3.375 3.375 0 0 0-3.375-3.375
                                                 h-1.5A1.125 1.125 0 0 0 12 5.625v6.75" />
                  </svg>
                </div>
              </div>
              <div>
                <p class="text-lg font-semibold route-title" th:text="${route.origin} + ' → ' + ${route.destination}">
                </p>
                <p class="text-sm text-[var(--text-secondary)] route-bus"
                  th:text="${route.bus.busName} + ' — ' + ${route.bus.busNumber} ">
                </p>
                <p class="text-sm text-[var(--text-secondary)] route-time"
                  th:text="${route.pickupTime} + ' — ' + ${route.dropTime}"></p>
              </div>
            </div>

            <div class="text-right">
              <span th:classappend="${route.bus.busType == 'AC'} ? 'bg-green-500 text-green-100' :
                               (route.bus.busType == 'Non-AC' ? 'bg-yellow-500 text-yellow-100' : '')"
                class="px-3 py-1 text-xs font-semibold leading-5 rounded-full route-status"
                th:text="${route.bus.busType}">
                Status
              </span>
              <p class="text-xl font-bold text-[var(--primary-color)] route-price"
                th:text="'₹' + ${route.pricePerSeat}"></p>
              <p class="text-sm text-[var(--text-secondary)] route-seats"
                th:text="${route.bus.capacity} + ' seats left'"></p>
            </div>
          </a>
        </div>
      </div>
    </div>
  </main>
</th:block>

<th:block layout:fragment="page-script">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const synth = window.speechSynthesis;
      let voices = [];

      function getVoicesSafe() {
        return new Promise(resolve => {
          let voices = speechSynthesis.getVoices();
          if (voices.length) {
            resolve(voices);
          } else {
            // wait for voiceschanged
            window.speechSynthesis.onvoiceschanged = () => {
              voices = speechSynthesis.getVoices();
              resolve(voices);
            };
          }
        });
      }

      // load voices (may be async)
      function reloadVoices() {
        voices = synth.getVoices() || [];
      }
      reloadVoices();
      window.speechSynthesis.onvoiceschanged = reloadVoices;

      // prefer these locales in order (you can change)
      const preferredLangs = ['en-IN', 'en-GB', 'en-US', 'en'];

      // try to pick a voice by language and friendly name hints
      function pickVoice(preferredNameHint, voices) {
        if (!voices.length) return null;
        if (preferredNameHint) {
          const exact = voices.find(v => v.name && v.name.includes(preferredNameHint));
          if (exact) return exact;
        }
        const englishVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
        if (englishVoices.length) return englishVoices[0];
        return voices[0];
      }


      // Example: set a preferred voice name substring here if you want a specific voice
      // e.g. 'Google UK English Female', 'Samantha', 'Microsoft Zira'
      // Try to prefer a clean English voice
      const PREFERRED_VOICE_NAME = 'Google UK English Female';
      // Alternatives you can try:
      // 'Google US English', 'Microsoft Zira', 'Samantha'
      // change this to a name substring you prefer, or '' for auto

      async function speak(text, opts = {}) {
        if (!text || !('speechSynthesis' in window)) return;
        const { rate = 0.95, pitch = 1, volume = 1 } = opts;

        if (synth.speaking) synth.cancel();

        const u = new SpeechSynthesisUtterance(text);
        u.rate = rate;
        u.pitch = pitch;
        u.volume = volume;

        // ✅ Wait until voices are actually loaded
        const voices = await getVoicesSafe();
        const voice = pickVoice(PREFERRED_VOICE_NAME, voices);
        if (voice) u.voice = voice;

        synth.speak(u);
      }

      // Build a short, clean summary from the card's labeled elements
      // Build a labeled summary
      function buildSummary(el) {
        const title = el.querySelector('.route-title')?.innerText?.trim() || '';
        const bus = el.querySelector('.route-bus')?.innerText?.trim() || '';
        const time = el.querySelector('.route-time')?.innerText?.trim() || '';
        const price = el.querySelector('.route-price')?.innerText?.trim() || '';
        const seats = el.querySelector('.route-seats')?.innerText?.trim() || '';
        const status = el.querySelector('.route-status')?.innerText?.trim() || '';

        const parts = [];

        if (title) parts.push("Route: " + title);               // Origin → Destination
        if (bus) {
          const [busName, busNumber] = bus.split(" — ");
          if (busName) parts.push("Bus name: " + busName);
          if (busNumber) parts.push("Bus number: " + busNumber);
        }
        if (time) parts.push("Departure and arrival: " + time); // includes both
        if (status) parts.push("Bus type: " + status); // includes both
        if (price) parts.push("Price: " + price);
        if (seats) parts.push("Availability: " + seats);

        return parts.join(". ");
      }


      // Attach handlers
      document.querySelectorAll('.route-item').forEach(el => {
        let timer = null;
        let spoken = false;

        el.addEventListener('pointerenter', () => {
          // only trigger if hovered for >500ms
          timer = setTimeout(() => {
            const text = buildSummary(el);
            speak(text, { rate: 0.95, pitch: 1 });
            spoken = true;
          }, 500); // adjust delay as needed
        });

        el.addEventListener('pointerleave', () => {
          clearTimeout(timer);   // stop pending speech
          if (spoken && synth.speaking) synth.cancel(); // stop ongoing speech
          spoken = false;
        });

        // keyboard accessibility: read on focus
        el.addEventListener('focus', () => {
          const text = buildSummary(el);
          speak(text, { rate: 0.95, pitch: 1 });
          spoken = true;
        });
        el.addEventListener('blur', () => {
          if (spoken && synth.speaking) synth.cancel();
          spoken = false;
        });

        // optional: on touch devices, a quick tap could speak
        el.addEventListener('touchstart', (ev) => {
          ev.preventDefault();
          const text = buildSummary(el);
          speak(text, { rate: 0.95, pitch: 1 });
          spoken = true;
        }, { passive: false });
      });


      const form = document.getElementById("routeSearchForm");

      form.addEventListener("submit", function (event) {
        clearErrors();

        validateRequired("origin", "Please enter origin city", event);
        validateRequired("destination", "Please enter destination city", event);
        validateDate("date", "Please select a valid date", event);
      });

      function clearErrors() {
        document.querySelectorAll(".error-message").forEach(el => el.remove());
      }

      function appendError(fieldId, msg, event) {
        const field = document.getElementById(fieldId);
        if (field && !field.parentNode.querySelector(".error-message")) {
          const errorEl = document.createElement("p");
          errorEl.className = "error-message text-red-500 text-sm mt-1";
          errorEl.textContent = msg;
          field.insertAdjacentElement("afterend", errorEl);
        }
        event.preventDefault();
      }

      function validateRequired(fieldId, msg, event) {
        const val = document.getElementById(fieldId).value.trim();
        if (val === "") {
          appendError(fieldId, msg, event);
        }
      }

      function validateDate(fieldId, msg, event) {
        const val = document.getElementById(fieldId).value;
        if (!val) {
          appendError(fieldId, msg, event);
        } else {
          const selected = new Date(val);
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          if (selected < today) {
            appendError(fieldId, "Date cannot be in the past", event);
          }
        }
      }


      // clear error on input
      document.querySelectorAll("#origin, #destination, #date").forEach(el => {
        el.addEventListener("input", () => {
          const error = el.parentNode.querySelector(".error-message");
          if (error) error.remove();
        });
      });
    });
  </script>
</th:block>

</html>
