<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>TravelEase - Sign Up</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style type="text/tailwindcss">
        :root {
        --primary-color: #38e07b;
        --secondary-color: #2a9e58;
        --background-color: #1a1a1a;
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0a0;
        --accent-color: #4ce68c;
      }
      body {
        font-family: 'Spline Sans', sans-serif;
      }
      .form-input-custom {
        @apply w-full rounded-lg border border-gray-600 bg-gray-700 p-4 text-base text-[var(--text-primary)] placeholder-gray-500 focus:border-[var(--primary-color)] focus:outline-none focus:ring-1 focus:ring-[var(--primary-color)];
      }
      .form-checkbox-custom {
        @apply h-5 w-5 rounded border-gray-600 bg-gray-700 text-[var(--primary-color)] focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2 focus:ring-offset-gray-800;
      }
    </style>
</head>

<body class="bg-[var(--background-color)] text-[var(--text-primary)]">
    <div class="flex min-h-screen flex-col">
        <header class="w-full border-b border-gray-700 bg-gray-900/50 backdrop-blur-sm">
            <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
                <div class="flex items-center gap-3">
                    <div class="size-8 text-[var(--primary-color)]">
                        <svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                            <path clip-rule="evenodd"
                                d="M39.475 21.6262C40.358 21.4363 40.6863 21.5589 40.7581 21.5934C40.7876 21.655 40.8547 21.857 40.8082 22.3336C40.7408 23.0255 40.4502 24.0046 39.8572 25.2301C38.6799 27.6631 36.5085 30.6631 33.5858 33.5858C30.6631 36.5085 27.6632 38.6799 25.2301 39.8572C24.0046 40.4502 23.0255 40.7407 22.3336 40.8082C21.8571 40.8547 21.6551 40.7875 21.5934 40.7581C21.5589 40.6863 21.4363 40.358 21.6262 39.475C21.8562 38.4054 22.4689 36.9657 23.5038 35.2817C24.7575 33.2417 26.5497 30.9744 28.7621 28.762C30.9744 26.5497 33.2417 24.7574 35.2817 23.5037C36.9657 22.4689 38.4054 21.8562 39.475 21.6262ZM4.41189 29.2403L18.7597 43.5881C19.8813 44.7097 21.4027 44.9179 22.7217 44.7893C24.0585 44.659 25.5148 44.1631 26.9723 43.4579C29.9052 42.0387 33.2618 39.5667 36.4142 36.4142C39.5667 33.2618 42.0387 29.9052 43.4579 26.9723C44.1631 25.5148 44.659 24.0585 44.7893 22.7217C44.9179 21.4027 44.7097 19.8813 43.5881 18.7597L29.2403 4.41187C27.8527 3.02428 25.8765 3.02573 24.2861 3.36776C22.6081 3.72863 20.7334 4.58419 18.8396 5.74801C16.4978 7.18716 13.9881 9.18353 11.5858 11.5858C9.18354 13.988 7.18717 16.4978 5.74802 18.8396C4.58421 20.7334 3.72865 22.6081 3.36778 24.2861C3.02574 25.8765 3.02429 27.8527 4.41189 29.2403Z"
                                fill="currentColor" fill-rule="evenodd"></path>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold">TravelEase</h1>
                </div>
                <nav class="hidden items-center gap-8 md:flex">
                    <a class="text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                        href="index.html">Home</a>
                    <a class="text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                        href="#">About</a>
                    <a class="text-sm font-medium text-[var(--text-secondary)] hover:text-[var(--text-primary)]"
                        href="#">Contact</a>
                    <a class="rounded-full bg-gray-800 px-5 py-2.5 text-sm font-semibold text-[var(--text-primary)] transition-colors hover:bg-gray-700"
                        href="login.html">Login</a>
                </nav>
                <button class="md:hidden">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6h16M4 12h16m-7 6h7" stroke-linecap="round" stroke-linejoin="round"
                            stroke-width="2"></path>
                    </svg>
                </button>
            </div>
        </header>
        <main class="flex flex-1 items-center justify-center py-12 sm:px-6 lg:px-8">
            <div class="w-full max-w-md space-y-8">
                <div class="text-center">
                    <h2 class="text-3xl font-bold tracking-tight text-[var(--text-primary)]">Create your account</h2>
                    <p class="mt-2 text-sm text-[var(--text-secondary)]">Join us and start your journey with ease.</p>
                </div>
                <form class="mt-8 space-y-6 rounded-2xl bg-gray-900 p-8 shadow-2xl">
                    <div class="space-y-4">
                        <div>
                            <label class="sr-only" for="full-name">Full Name</label>
                            <input autocomplete="name" class="form-input-custom" id="full-name" name="full-name"
                                placeholder="Full Name" required="" type="text" />
                        </div>
                        <div>
                            <label class="sr-only" for="email-address">Email address</label>
                            <input autocomplete="email" class="form-input-custom" id="email-address" name="email"
                                placeholder="Email address" required="" type="email" />
                        </div>
                        <div>
                            <label class="sr-only" for="password">Password</label>
                            <input autocomplete="new-password" class="form-input-custom" id="password" name="password"
                                placeholder="Password" required="" type="password" />
                        </div>
                        <div>
                            <label class="sr-only" for="contact-number">Contact Number</label>
                            <input autocomplete="tel" class="form-input-custom" id="contact-number"
                                name="contact-number" placeholder="Contact Number" required="" type="tel" />
                        </div>
                    </div>
                    <div class="flex items-center">
                        <input class="form-checkbox-custom" id="terms-and-conditions" name="terms-and-conditions"
                            required="" type="checkbox" />
                        <label class="ml-3 block text-sm text-[var(--text-secondary)]" for="terms-and-conditions"> I
                            agree to the <a
                                class="font-medium text-[var(--primary-color)] hover:text-[var(--secondary-color)]"
                                href="#">Terms and Conditions</a> </label>
                    </div>
                    <div>
                        <button
                            class="group relative flex w-full justify-center rounded-lg border border-transparent bg-[var(--primary-color)] px-4 py-3 text-base font-semibold text-gray-900 transition-colors hover:bg-[var(--secondary-color)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2 focus:ring-offset-gray-900"
                            type="submit">
                            Sign Up
                        </button>
                    </div>
                    <p class="mt-6 text-center text-sm text-[var(--text-secondary)]">
                        Already have an account?
                        <a class="font-medium text-[var(--primary-color)] hover:text-[var(--secondary-color)]"
                            href="login.html">
                            Login </a>
                    </p>
                </form>
            </div>
        </main>
         <footer class="bg-gray-900 text-[var(--text-secondary)] mt-auto">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-sm">
                <p>© 2025 TravelEase. All rights reserved.</p>
            </div>
        </footer>
    </div>

</body>

</html>
