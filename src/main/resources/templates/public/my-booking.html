<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{public/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='my-booking'">
<head>
    <title>TravelEase - Bus Booking</title>
</head>

<th:block layout:fragment="content">
    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-3xl font-bold text-[var(--text-primary)] mb-6">My Bookings</h2>
            <div class="mb-6 border-b border-gray-700">
                <div class="flex space-x-8">
                    <a class="pb-3 px-1 text-[var(--primary-color)] border-b-2 border-[var(--primary-color)] font-semibold text-base"
                       href="#">Upcoming</a>
                    <a class="pb-3 px-1 text-[var(--text-secondary)] hover:text-[var(--primary-color)] border-b-2 border-transparent hover:border-[var(--primary-color)] transition-colors duration-200 ease-in-out text-base"
                       href="#">Past</a>
                </div>
            </div>
            <div class="space-y-4">
                <div class="bg-gray-800 rounded-lg shadow-md border border-gray-700 overflow-hidden">
                    <div class="p-6">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center">
                            <div>
                                <p class="text-sm text-[var(--text-secondary)]">2024-03-15, 10:00 AM</p>
                                <h3 class="text-xl font-semibold text-[var(--text-primary)] mt-1">Downtown to
                                    Airport</h3>
                                <p class="text-sm text-[var(--text-secondary)] mt-1">Booking ID: 123456789</p>
                            </div>
                            <div class="mt-4 sm:mt-0 sm:ml-6 flex-shrink-0">
                                    <span
                                            class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-600 text-white">
                                        Confirmed
                                    </span>
                            </div>
                        </div>
                        <div class="mt-6 pt-4 border-t border-gray-700 flex items-center justify-end gap-3">
                            <button
                                    class="px-4 py-2 border border-[var(--primary-color)] text-[var(--primary-color)] text-sm font-medium rounded-md hover:bg-[var(--primary-color)] hover:text-[var(--background-color)] transition-colors duration-200">
                                Cancel Booking
                            </button>
                            <button
                                    class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-[var(--background-color)] bg-[var(--primary-color)] hover:bg-[var(--accent-color)]">
                                View Ticket
                            </button>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-800 rounded-lg shadow-md border border-gray-700 overflow-hidden">
                    <div class="p-6">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center">
                            <div>
                                <p class="text-sm text-[var(--text-secondary)]">2024-03-16, 2:00 PM</p>
                                <h3 class="text-xl font-semibold text-[var(--text-primary)] mt-1">Airport to
                                    Suburbia</h3>
                                <p class="text-sm text-[var(--text-secondary)] mt-1">Booking ID: 987654321</p>
                            </div>
                            <div class="mt-4 sm:mt-0 sm:ml-6 flex-shrink-0">
                                    <span
                                            class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-600 text-white">
                                        Confirmed
                                    </span>
                            </div>
                        </div>
                        <div class="mt-6 pt-4 border-t border-gray-700 flex items-center justify-end gap-3">
                            <button
                                    class="px-4 py-2 border border-[var(--primary-color)] text-[var(--primary-color)] text-sm font-medium rounded-md hover:bg-[var(--primary-color)] hover:text-[var(--background-color)] transition-colors duration-200">
                                Cancel Booking
                            </button>
                            <button
                                    class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-[var(--background-color)] bg-[var(--primary-color)] hover:bg-[var(--accent-color)]">
                                View Ticket
                            </button>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-800 rounded-lg shadow-md border border-gray-700 overflow-hidden">
                    <div class="p-6">
                        <div class="flex flex-col sm:flex-row justify-between sm:items-center">
                            <div>
                                <p class="text-sm text-[var(--text-secondary)]">2024-03-17, 5:00 PM</p>
                                <h3 class="text-xl font-semibold text-[var(--text-primary)] mt-1">Suburbia to
                                    Downtown</h3>
                                <p class="text-sm text-[var(--text-secondary)] mt-1">Booking ID: 112233445</p>
                            </div>
                            <div class="mt-4 sm:mt-0 sm:ml-6 flex-shrink-0">
                                    <span
                                            class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-600 text-white">
                                        Cancelled
                                    </span>
                            </div>
                        </div>
                        <div class="mt-6 pt-4 border-t border-gray-700 flex items-center justify-end">
                            <button
                                    class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-[var(--background-color)] bg-[var(--primary-color)] hover:bg-[var(--accent-color)]"
                                    disabled="">
                                View Ticket
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</th:block>

</html>
