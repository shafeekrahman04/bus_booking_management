<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='buses'">
<head>
    <title>Bus List </title>
</head>
<th:block layout:fragment="content">

    <main class="flex-1 p-8">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-4xl font-bold text-white">Bus List</h1>
            <button
                    class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--primary-color)] text-black font-semibold hover:bg-[var(--secondary-color)] transition-colors">
                <svg fill="currentColor" height="20px" width="20px" viewBox="0 0 256 256">
                    <path
                            d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"/>
                </svg>
                <span>Add New Bus</span>
            </button>
        </header>

        <!-- Search -->
        <div class="mb-4">
            <input
                    class="w-full bg-gray-800 border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)]"
                    placeholder="Search buses..." type="text"/>
        </div>

        <!-- Table -->
        <div class="table-responsive bg-gray-800 rounded-xl border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-900">
                <tr>
                    <th class="px-6 py-4 text-sm font-semibold text-white">Bus Number</th>
                    <th class="px-6 py-4 text-sm font-semibold text-white">Model</th>
                    <th class="px-6 py-4 text-sm font-semibold text-white">Capacity</th>
                    <th class="px-6 py-4 text-sm font-semibold text-white">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                <tr>
                    <td class="px-6 py-4 text-sm text-white">BS-001</td>
                    <td class="px-6 py-4 text-sm text-[var(--text-secondary)]">Volvo 9400</td>
                    <td class="px-6 py-4 text-sm text-[var(--text-secondary)]">45</td>
                    <td class="px-6 py-4 text-sm space-x-2">
                        <button class="text-blue-400 hover:text-blue-300">Edit</button>
                        <button class="text-red-400 hover:text-red-300">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td class="px-6 py-4 text-sm text-white">BS-002</td>
                    <td class="px-6 py-4 text-sm text-[var(--text-secondary)]">Scania Metrolink</td>
                    <td class="px-6 py-4 text-sm text-[var(--text-secondary)]">53</td>
                    <td class="px-6 py-4 text-sm space-x-2">
                        <button class="text-blue-400 hover:text-blue-300">Edit</button>
                        <button class="text-red-400 hover:text-red-300">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td class="px-6 py-4 text-sm text-white">BS-003</td>
                    <td class="px-6 py-4 text-sm text-[var(--text-secondary)]">Mercedes-Benz Tourismo
                    </td>
                    <td class="px-6 py-4 text-sm text-[var(--text-secondary)]">49</td>
                    <td class="px-6 py-4 text-sm space-x-2">
                        <button class="text-blue-400 hover:text-blue-300">Edit</button>
                        <button class="text-red-400 hover:text-red-300">Delete</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</th:block>
<th:block layout:fragment="page-script">
</th:block>
</html>
