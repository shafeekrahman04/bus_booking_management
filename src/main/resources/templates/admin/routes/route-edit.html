<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/layout}"
      th:with="activePage='routes'">

<head>
  <title>Edit Route</title>
</head>
<th:block layout:fragment="content">

  <main class="flex flex-1 justify-center py-10 px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-lg">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-[var(--text-primary)] tracking-tight">Edit Route</h1>
        <p class="text-base text-[var(--text-secondary)] mt-2">
          Update the details below to edit this route.
        </p>
      </div>

      <!-- Success Message -->
      <div th:if="${successMessage}"
           class="mb-4 p-4 text-green-800 rounded-lg bg-green-100 border border-green-300">
        <p th:text="${successMessage}"></p>
      </div>

      <!-- Error Message -->
      <div th:if="${errorMessage}"
           class="mb-4 p-4 text-red-800 rounded-lg bg-red-100 border border-red-300">
        <p th:text="${errorMessage}"></p>
      </div>

      <div class="bg-gray-800/50 p-8 rounded-xl border border-gray-700">
        <form th:action="@{/admin/routes/update}" th:object="${routesForm}" method="post" class="space-y-6"
              id="routesForm">
          <input type="hidden" th:field="*{id}" />
          <div>
            <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2"
                   for="busId">Bus</label>
            <select th:field="*{busId}" id="busId"
                    class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg
                 text-[var(--text-primary)] focus:outline-none
                 focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition">
              <option value="">-- Select Bus --</option>
              <option th:each="bus : ${buses}"
                      th:value="${bus.id}"
                      th:text="${bus.busNumber + ' - ' + bus.busName}">
              </option>
            </select>
          </div>


          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="origin">Origin</label>
              <input th:field="*{origin}" id="origin"
                     class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg"
                     type="text" placeholder="Enter origin"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2"
                     for="destination">Destination</label>
              <input th:field="*{destination}" id="destination"
                     class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg"
                     type="text" placeholder="Enter destination"/>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="distance">Distance
                (km)</label>
              <input th:field="*{distance}" id="distance"
                     class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg"
                     type="text" placeholder="Enter distance"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2"
                     for="pricePerSeat">Price per Seat</label>
              <input th:field="*{pricePerSeat}" id="pricePerSeat"
                     class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg"
                     type="number" placeholder="Enter price"/>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2"
                     for="date">Date</label>
              <input th:field="*{date}" id="date"
                     class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg"
                     type="date"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="pickupTime">Pickup
                Time</label>
              <input th:field="*{pickupTime}" id="pickupTime"
                     class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg"
                     type="time"/>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="dropTime">Drop
              Time</label>
            <input th:field="*{dropTime}" id="dropTime"
                   class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg"
                   type="time"/>
          </div>

          <div class="pt-4">
            <button
                    class="w-full bg-[var(--primary-color)] text-black px-6 py-3.5 rounded-lg
                                font-bold text-base hover:bg-[var(--accent-color)]
                                focus:outline-none focus:ring-4 focus:ring-[var(--primary-color)]
                                focus:ring-opacity-50 transition-all duration-300"
                    type="submit">
              Update Route
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>
</th:block>

<th:block layout:fragment="page-script">
  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
      const form = document.getElementById('routesForm');

      form.addEventListener('submit', function (event) {
        clearErrorMessages();
        validateField('busId', 'Please select bus', event);
        validateField('origin', 'Please enter origin', event);
        validateField('destination', 'Please enter destination', event);
        validateField('distance', 'Please enter distance', event);
        validateField('pricePerSeat', 'Please enter price per seat', event);
        validateField('date', 'Please select a date', event);
        validateField('pickupTime', 'Please select pickup time', event);
        validateField('dropTime', 'Please select drop time', event);
      });

      function clearErrorMessages() {
        document.querySelectorAll('.error-message').forEach(function (error) {
          error.remove();
        });
      }

      function appendErrorMessage(fieldId, errorMessage, event) {
        const field = document.getElementById(fieldId);
        if (field) {
          const errorMessageElement = document.createElement('p');
          errorMessageElement.className = 'error-message text-red-500 text-sm mt-1';
          errorMessageElement.textContent = errorMessage;
          field.insertAdjacentElement('afterend', errorMessageElement);
        }
        event.preventDefault();
      }

      function validateField(fieldId, errorMessage, event) {
        const fieldValue = document.getElementById(fieldId).value.trim();
        if (fieldValue === '') {
          appendErrorMessage(fieldId, errorMessage, event);
        }
      }

      document.querySelectorAll('input, textarea, select').forEach(function (element) {
        element.addEventListener('change', function () {
          const errorMessages = this.parentNode.querySelectorAll('.error-message');
          errorMessages.forEach(function (error) {
            error.remove();
          });
        });
      });
    });


    </script>
</th:block>
</html>
