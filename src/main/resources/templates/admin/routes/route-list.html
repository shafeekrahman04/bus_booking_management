<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='routes'">
<head>
    <title>Route List </title>
</head>
<th:block layout:fragment="content">

    <!-- Main Content (Bus List Only) -->
    <main class="flex-1 p-8">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-4xl font-bold text-white">Route List</h1>
            <a th:href="@{/admin/routes/add}"
               class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--primary-color)] text-black font-semibold hover:bg-[var(--secondary-color)] transition-colors">
                <svg fill="currentColor" height="20px" viewBox="0 0 256 256" width="20px"
                     xmlns="http://www.w3.org/2000/svg">
                    <path
                            d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
                <span>Add New Route</span>
            </a>
        </header>
        <div class="mb-4"><input
                class="w-full bg-gray-800 border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)]"
                placeholder="Search routes..." type="text"/></div>
        <div class="table-responsive bg-gray-800 rounded-xl border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-900">
                <tr>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Route ID
                        <span class="ml-1">↕️</span>
                    </th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Date
                        <span class="ml-1">↕️</span>
                    </th><th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Origin
                        <span class="ml-1">↕️</span>
                    </th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">
                        Destination <span class="ml-1">↕️</span></th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Departure
                        Time <span class="ml-1">↕️</span></th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Arrival
                        Time <span class="ml-1">↕️</span></th>
                    <th class="px-6 py-4 text-sm font-semibold text-white">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                <tr th:each="route : ${route}">
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-white"
                        th:text="${'RT-' + route.id}">RT-101
                    </td><td class="px-6 py-4 whitespace-nowrap text-sm text-white"
                        th:text="${route.date}">
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                        th:text="${route.origin}">City A
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                        th:text="${route.destination}">City B
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                        th:text="${route.pickupTime}">08:00 AM
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                        th:text="${route.dropTime}">01:00 PM
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                        <a th:href="@{'/admin/routes/edit/' + ${route.id}}"
                           class="text-blue-400 hover:text-blue-300">Edit</a>
                        <a href="javascript:void(0);" th:attr="data-id=${route.id}"
                           class="text-red-400 hover:text-red-300 delete-bus">
                            Delete
                        </a>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </main>
</th:block>
<th:block layout:fragment="page-script">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const deleteLinks = document.querySelectorAll(".delete-bus");

            deleteLinks.forEach(link => {
                link.addEventListener("click", function () {
                    const routeId = this.getAttribute("data-id");

                    Swal.fire({
                        title: "Are you sure?",
                        text: "You won’t be able to revert this!",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: "#d33",
                        cancelButtonColor: "#3085d6",
                        confirmButtonText: "Yes, delete it!",
                        cancelButtonText: "No, cancel"
                    }).then((result) => {
                        if (result.isConfirmed) {
                            fetch(`/admin/routes/delete/${routeId}`, { method: "GET" })
                                .then(response => {
                                    if (response.ok) {
                                        Swal.fire(
                                            "Deleted!",
                                            "Routes has been deleted successfully.",
                                            "success"
                                        ).then(() => {
                                            // reload page after success
                                            window.location.reload();
                                        });
                                    } else {
                                        Swal.fire("Error!", "Failed to delete routes.", "error");
                                    }
                                })
                                .catch(() => {
                                    Swal.fire("Error!", "Something went wrong.", "error");
                                });
                        }
                    });
                });
            });
        });

    </script>
</th:block>
</html>
