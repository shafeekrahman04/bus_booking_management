<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='bookings'">
<head>
    <title>Booking List </title>
</head>
<th:block layout:fragment="content">
    <!-- Main Content (Bus List Only) -->
    <main class="flex-1 p-8">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-4xl font-bold text-white">Booking List</h1>
            <button
                    class="flex items-center gap-2 px-4 py-2 rounded-lg bg-[var(--primary-color)] text-black font-semibold hover:bg-[var(--secondary-color)] transition-colors">
                <svg fill="currentColor" height="20px" viewBox="0 0 256 256" width="20px"
                     xmlns="http://www.w3.org/2000/svg">
                    <path
                            d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z">
                    </path>
                </svg>
                <span>Add New Booking</span>
            </button>
        </header>
        <div class="mb-4"><input
                class="w-full bg-gray-800 border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)]"
                placeholder="Search bookings..." type="text"/></div>
        <div class="table-responsive bg-gray-800 rounded-xl border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-900">
                <tr>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Booking ID
                        <span class="ml-1">↕️</span>
                    </th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Passenger
                        <span class="ml-1">↕️</span>
                    </th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Route ID
                        <span class="ml-1">↕️</span>
                    </th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Bus Number
                        <span class="ml-1">↕️</span>
                    </th>
                    <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Status
                        <span class="ml-1">↕️</span>
                    </th>
                    <th class="px-6 py-4 text-sm font-semibold text-white">Actions</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-white">BK-551</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        John Doe
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        RT-101
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        BS-001
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-green-400">Confirmed</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                        <button
                                class="text-blue-400 hover:text-blue-300">View
                        </button>
                        <button
                                class="text-red-400 hover:text-red-300">Cancel
                        </button>
                    </td>
                </tr>
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-white">BK-552</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        Jane Smith
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        RT-102
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        BS-002
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-yellow-400">Pending</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                        <button
                                class="text-blue-400 hover:text-blue-300">View
                        </button>
                        <button
                                class="text-red-400 hover:text-red-300">Cancel
                        </button>
                    </td>
                </tr>
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-white">BK-553</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        Mike Johnson
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        RT-101
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                        BS-001
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-red-400">Cancelled</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm space-x-2">
                        <button
                                class="text-blue-400 hover:text-blue-300">View
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</th:block>
<th:block layout:fragment="page-script">
</th:block>
</html>
