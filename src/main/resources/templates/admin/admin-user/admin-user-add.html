<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{admin/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='users'">

<head>
    <title>Admin User Add</title>
</head>
<th:block layout:fragment="content">

    <main class="flex flex-1 justify-center py-10 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-lg">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-[var(--text-primary)] tracking-tight">Add a New User</h1>
                <p class="text-base text-[var(--text-secondary)] mt-2">
                    Enter the details below to add a new user.
                </p>
            </div>

            <!-- Success/Error Messages -->
            <div th:if="${successMessage}"
                 class="mb-4 p-4 text-green-800 rounded-lg bg-green-100 border border-green-300">
                <p th:text="${successMessage}"></p>
            </div>

            <div th:if="${errorMessage}"
                 class="mb-4 p-4 text-red-800 rounded-lg bg-red-100 border border-red-300">
                <p th:text="${errorMessage}"></p>
            </div>

            <div class="bg-gray-800/50 p-8 rounded-xl border border-gray-700">
                <form th:action="@{/admin/user/post}" th:object="${adminUserForm}" method="post" class="space-y-6"
                      id="userForm">

                    <!-- Name -->
                    <div>
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="name">Full Name</label>
                        <input th:field="*{name}"
                               class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition"
                               id="name" placeholder="e.g., John Doe" type="text"/>
                    </div>

                    <!-- Username -->
                    <div>
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="username">Username</label>
                        <input th:field="*{username}"
                               class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition"
                               id="username" placeholder="e.g., johndoe" type="text"/>
                    </div>

                    <!-- Mobile & Email -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="mobileNumber">Mobile Number</label>
                            <input th:field="*{mobileNumber}"
                                   class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition"
                                   id="mobileNumber" placeholder="e.g., +91 9876543210" type="text"/>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="email">Email</label>
                            <input th:field="*{email}"
                                   class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition"
                                   id="email" placeholder="e.g., john@example.com" type="email"/>
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="password">Password</label>
                        <input th:field="*{password}"
                               class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-[var(--text-primary)] placeholder-[var(--text-secondary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition"
                               id="password" placeholder="Enter password" type="password"/>
                    </div>

                    <!-- Role -->
                    <div>
                        <label class="block text-sm font-medium text-[var(--text-secondary)] mb-2" for="role">Role</label>
                        <select th:field="*{role}"
                                class="block w-full px-4 py-3 bg-gray-900 border border-gray-700 rounded-lg text-[var(--text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:border-transparent transition appearance-none"
                                id="role">
                            <option value="">-- Select Role --</option>
                            <option value="ADMIN">Admin</option>
                            <option value="EMPLOYEE">Staff</option>
                        </select>
                    </div>

                    <!-- Submit -->
                    <div class="pt-4">
                        <button
                                class="w-full bg-[var(--primary-color)] text-black px-6 py-3.5 rounded-lg font-bold text-base hover:bg-[var(--accent-color)] focus:outline-none focus:ring-4 focus:ring-[var(--primary-color)] focus:ring-opacity-50 transition-all duration-300"
                                type="submit">
                            Add User
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</th:block>

<th:block layout:fragment="page-script">
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('userForm');

            form.addEventListener('submit', function (event) {
                clearErrorMessages();
                validateField('name', 'Please enter full name', event);
                validateField('username', 'Please enter username', event);
                validateField('mobileNumber', 'Please enter mobile number', event);
                validateField('email', 'Please enter email', event);
                validateField('password', 'Please enter password', event);
                validateField('role', 'Please select a role', event);
            });

            function clearErrorMessages() {
                document.querySelectorAll('.error-message').forEach(function (error) {
                    error.remove();
                });
            }

            function appendErrorMessage(fieldId, errorMessage, event) {
                const field = document.getElementById(fieldId);
                if (field) {
                    const errorMessageElement = document.createElement('p');
                    errorMessageElement.className = 'error-message text-red-500 text-sm mt-1';
                    errorMessageElement.textContent = errorMessage;
                    field.insertAdjacentElement('afterend', errorMessageElement);
                }
                event.preventDefault();
            }

            function validateField(fieldId, errorMessage, event) {
                const fieldValue = document.getElementById(fieldId).value.trim();
                if (fieldValue === '') {
                    appendErrorMessage(fieldId, errorMessage, event);
                }
            }

            document.querySelectorAll('input, textarea, select').forEach(function (element) {
                element.addEventListener('change', function () {
                    const errorMessages = this.parentNode.querySelectorAll('.error-message');
                    errorMessages.forEach(function (error) {
                        error.remove();
                    });
                });
            });
        });
    </script>
</th:block>

</html>
