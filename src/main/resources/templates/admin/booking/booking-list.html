<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{admin/layout}"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='bookings'">

<head>
    <title>Booking List </title>
</head>
<th:block layout:fragment="content">
    <!-- Main Content (Bus List Only) -->
    <main class="flex-1 p-8">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-4xl font-bold text-white">Booking List</h1>
        </header>
        <div class="mb-4"><input
                class="w-full bg-gray-800 border-gray-700 rounded-lg px-4 py-2 text-white focus:ring-[var(--primary-color)] focus:border-[var(--primary-color)]"
                placeholder="Search bookings..." type="text" /></div>
        <div class="table-responsive bg-gray-800 rounded-xl border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-900">
                    <tr>
                        <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Booking ID
                            <span class="ml-1">↕️</span>
                        </th>
                        <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Passenger
                            <span class="ml-1">↕️</span>
                        </th>
                        <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Route ID
                            <span class="ml-1">↕️</span>
                        </th>
                        <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Bus Number
                            <span class="ml-1">↕️</span>
                        </th>
                        <th class="px-6 py-4 text-sm font-semibold text-white cursor-pointer">Status
                            <span class="ml-1">↕️</span>
                        </th>
                        <th class="px-6 py-4 text-sm font-semibold text-white">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <tr th:each="b : ${booking}">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-white" th:text="${b.id}">BK-XXX</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                            th:text="${b.passengerName}">John Doe
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                            th:text="${b.busNumber}">RT-101
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]">
                            <!-- Example: If you also need bus number, add it to BookingForm -->
                            <span th:text="${b.busNumber}">BS-001</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span th:classappend="${b.status == 'CONFIRMED'} ? 'bg-blue-600 text-white' :
                                                      (${b.status == 'CANCELLED'} ? 'bg-red-600 text-white' : '')"
                                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                                th:text="${b.status}">
                                Status
                            </span>
                        </td>

                        <td class="px-6 py-4 text-sm flex space-x-4">
                            <!-- View Button -->
                            <a th:href="@{'/admin/bookings/' + ${b.id} + '/view'}"
                                class="text-blue-400 hover:text-blue-300">View</a>

                            <!-- Cancel Button -->
                            <a href="javascript:void(0);" th:attr="data-id=${b.id}" th:if="${b.status != 'CANCELLED'}"
                                class="text-red-400 hover:text-red-300 cancel-booking">
                                Cancel
                            </a>
                        </td>
                </tbody>

            </table>
        </div>
    </main>
</th:block>
<th:block layout:fragment="page-script">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cancelLinks = document.querySelectorAll(".cancel-booking");

            cancelLinks.forEach(link => {
                link.addEventListener("click", function () {
                    const bookingId = this.getAttribute("data-id");

                    Swal.fire({
                        title: "Are you sure?",
                        text: "This booking will be cancelled!",
                        icon: "warning",
                        showCancelButton: true,
                        confirmButtonColor: "#d33",
                        cancelButtonColor: "#3085d6",
                        confirmButtonText: "Yes, cancel it!",
                        cancelButtonText: "No, keep it"
                    }).then((result) => {
                        if (result.isConfirmed) {
                            fetch(`/admin/bookings/${bookingId}/cancel`, {
                                method: "POST"
                            })
                                .then(response => {
                                    if (response.ok) {
                                        Swal.fire(
                                            "Cancelled!",
                                            "Booking has been cancelled.",
                                            "success"
                                        ).then(() => {
                                            window.location.reload();
                                        });
                                    } else {
                                        Swal.fire("Error!", "Failed to cancel booking.", "error");
                                    }
                                })
                                .catch(() => {
                                    Swal.fire("Error!", "Something went wrong.", "error");
                                });
                        }
                    });
                });
            });
        });
    </script>
</th:block>


</html>
