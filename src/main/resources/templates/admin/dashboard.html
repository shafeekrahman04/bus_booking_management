<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" layout:decorate="~{admin/layout}"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" th:with="activePage='dashboard'">

<head>
    <title>Dashboard </title>
</head>
<th:block layout:fragment="content">

    <main class="flex-1 p-8">
        <header class="mb-8">
            <h1 class="text-4xl font-bold text-white">Dashboard</h1>
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-[var(--text-secondary)] text-base font-medium">Total Bookings</p>
                <p class="text-white text-3xl font-bold" th:text="${dashboard.totalBookings}">0</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-[var(--text-secondary)] text-base font-medium">Active Routes</p>
                <p class="text-white text-3xl font-bold" th:text="${dashboard.activeRoutes}">0</p>
            </div>
            <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
                <p class="text-[var(--text-secondary)] text-base font-medium">New Users</p>
                <p class="text-white text-3xl font-bold" th:text="${dashboard.newUsers}">0</p>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-white mb-4">Recent Bookings</h2>
        <div class="table-responsive bg-gray-800 rounded-xl border border-gray-700">
            <table class="w-full text-left">
                <thead class="bg-gray-900">
                    <tr>
                        <th class="px-6 py-4 text-sm font-semibold text-white">Booking ID</th>
                        <th class="px-6 py-4 text-sm font-semibold text-white">Route</th>
                        <th class="px-6 py-4 text-sm font-semibold text-white">User</th>
                        <th class="px-6 py-4 text-sm font-semibold text-white">Date</th>
                        <th class="px-6 py-4 text-sm font-semibold text-white">Status</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <tr th:each="booking : ${dashboard.recentBookings}">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-white" th:text="${booking.bookingId}">
                            BKXXXXX
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                            th:text="${booking.route}">Route X
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                            th:text="${booking.user}">User X
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-[var(--text-secondary)]"
                            th:text="${booking.date}">2024-01-01
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <span th:classappend="${booking.status == 'CONFIRMED'} ? 'bg-blue-600 text-white' :
                                                      (${booking.status == 'CANCELLED'} ? 'bg-red-600 text-white' : '')"
                                class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium"
                                th:text="${booking.status}">
                                Status
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</th:block>
<th:block layout:fragment="page-script">
</th:block>

</html>
